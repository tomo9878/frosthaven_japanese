name: Auto Release on Push

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたら即座に実行

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースを作成する権限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # コミットメッセージ取得のために履歴を全部取る

      - name: Get Commit Message
        id: commit_msg
        # 直前のコミットメッセージを環境変数に入れる
        run: echo "msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Create ZIP
        # 配布したいファイル名をここに並べる
        run: zip -r frosthaven_jp_mod.zip I2Languages.txt README.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          # タグ名は重複できないので「日時」を自動で入れる
          tag_name: "release-${{ github.sha }}"
          # コミットメッセージをリリースのタイトルにする
          name: "${{ steps.commit_msg.outputs.msg }}"
          files: frosthaven_jp_mod.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
